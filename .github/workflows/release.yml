name: Release signed AAB

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "versionName (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
  push:
    tags:
      - "v*"

jobs:
  bundle:
    name: Build signed release bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/upload.p12"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/upload.p12" >> "$GITHUB_ENV"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.versionName }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "versionName=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "versionCode=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease \
            -PversionCode=${{ steps.version.outputs.versionCode }} \
            -PversionName=${{ steps.version.outputs.versionName }} \
            --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipflapp-${{ steps.version.outputs.versionName }}-${{ steps.version.outputs.versionCode }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
